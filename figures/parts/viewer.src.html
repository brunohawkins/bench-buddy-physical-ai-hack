<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Gallery</title>
<style>
:root{--page:#0b0b0b;--card:#131313;--text:#a3a3a3;--strong:#e6e6e6;--muted:#6e6e6e;--rule:#262626;--chip:#1c1c1c}
:root[data-theme="light"]{--page:#f2f2ef;--card:#fbfbfa;--text:#57575a;--strong:#18181a;--muted:#8c8c90;--rule:#e2e2de;--chip:#efefec}
*{box-sizing:border-box}
html{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;width:min(1240px,100% - 32px);margin:32px auto 64px}
.catalog{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 48px);overflow:auto}
.catalog h2{font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
.catalog h2:first-child{margin-top:0}
.catalog button{all:unset;cursor:pointer;padding:5px 10px;border-radius:7px;color:var(--text);font-size:13.5px}
.catalog button:hover{color:var(--strong);background:var(--chip)}
.catalog button[aria-current="true"]{color:var(--strong);background:var(--chip);box-shadow:inset 0 0 0 1px var(--rule)}
.catalog button:focus-visible{outline:2px solid var(--strong);outline-offset:1px}
.plate{position:relative;background:var(--card);border-radius:14px;box-shadow:inset 0 1px 0 0 #ffffff0a,0 0 0 1px #00000026,0 12px 24px -12px #00000040;overflow:hidden}
.stage{display:block;width:100%;aspect-ratio:16/10;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage:focus-visible{outline:2px solid var(--strong);outline-offset:-2px}
.corner{position:absolute;font:12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.corner[data-c="fig"]{top:20px;left:22px;color:var(--strong)}
.corner[data-c="title"]{top:20px;right:22px}
.corner[data-c="hint"]{bottom:20px;left:22px}
.corner[data-c="readout"]{bottom:20px;right:22px;color:var(--strong);text-transform:none;letter-spacing:0;max-width:62%;text-align:right;line-height:1.4}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.bar button{font:12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--strong);background:var(--chip);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--strong)}
.bar button:disabled{opacity:.4;cursor:default}
.bar button:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
.sim{margin:16px 0 0;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;background:var(--card)}
.sim-controls{display:flex;flex-wrap:wrap;gap:8px}
.sim-controls button{font:12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--text);background:var(--chip);border:1px solid var(--rule);border-radius:8px;padding:8px 11px;cursor:pointer}
.sim-controls button[aria-pressed="true"]{color:var(--strong);border-color:#3ccf72;box-shadow:inset 0 0 0 1px #3ccf7233}
.sim-note{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#3e63dd14;border:1px solid #3e63dd55;color:var(--text);font-size:13px;line-height:1.5}
.sim-note b{margin:0}
.sim-warn{list-style:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#e5484d14;border:1px solid #e5484d55;color:var(--strong);font-size:13px}
.sim-warn li::before{content:"⚠ ";color:#e5484d}
.sim-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 24px;margin-top:12px}
.sim h3{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.sim ul{list-style:none;margin:0;padding:0;font-size:13px}
.sim li{padding:2px 0}
.sim b{color:var(--strong);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;margin:18px 0 0;padding:0;list-style:none;font-size:13px}
.legend li{cursor:pointer;padding:2px 0}
.legend li[data-on]{color:var(--strong)}
.legend b{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-right:8px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;gap:12px;margin-top:16px}
  .catalog{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}
  .catalog h2{width:100%;margin:8px 0 2px}
  .corner[data-c="title"],.corner[data-c="hint"]{display:none}
  .corner[data-c="readout"]{max-width:90%}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="catalog" aria-label="Components"></nav>
  <main>
    <div class="plate">
      <canvas class="stage" tabindex="0" aria-label="3D component. Drag to rotate, right-drag to pan, scroll to zoom. E takes it apart, arrow keys step through its parts, G moves the selected part."></canvas>
      <span class="corner" data-c="fig">Parts</span>
      <span class="corner" data-c="title"></span>
      <span class="corner" data-c="hint">Drag to rotate · right-drag to pan · click a part</span>
      <span class="corner" data-c="readout" data-readout></span>
    </div>
    <div class="bar">
      <button data-act="explode" aria-pressed="false">Take apart (E)</button>
      <button data-act="spin" aria-pressed="true">Auto-rotate</button>
      <button data-act="move" aria-pressed="false">Move part (G)</button>
      <button data-act="reset">Reset view</button>
      <button data-act="top">Top</button>
      <button data-act="bottom">Bottom</button>
      <button data-act="theme">Light / dark</button>
      <button data-act="glb">Download .glb</button>
      <button data-act="board" aria-pressed="false">Breadboard (B)</button>
      <button data-act="demo" hidden>Radar demo layout</button>
      <button data-act="blinker" hidden>555 blinker (Bench Buddy)</button>
      <button data-act="follow" hidden aria-pressed="false">Follow Bench Buddy</button>
      <button data-act="layout" hidden>Copy layout</button>
    </div>
    <ul class="legend"></ul>
  </main>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
